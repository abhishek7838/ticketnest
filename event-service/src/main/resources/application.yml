server:
  port: 8081                    # Event service runs on 8081

spring:
  application:
    name: event-service
  datasource:
    url: jdbc:postgresql://localhost:5432/event_db   # its own database (ADR-0002)
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update          # auto-builds tables from entities — MVP only (backlog: Flyway)
    show-sql: true
    properties:
      hibernate:
        format_sql: true