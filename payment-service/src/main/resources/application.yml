server:
  port: 8084

spring:
  application:
    name: payment-service
  datasource:
    url: jdbc:postgresql://localhost:5432/payment_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

payment:
  webhook:
    # shared secret between us and the gateway. Local dev only — never commit real secrets.
    secret: "ticketnest-payment-webhook-secret-change-me"