server:
  port: 8082

spring:
  application:
    name: auth-service
  datasource:
    url: jdbc:postgresql://localhost:5432/auth_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

jwt:
  # Base64 secret, >= 256 bits for HS256. Fine for local learning; in production this
  # comes from config/env and is never committed (backlog: externalize via Config Server).
  secret: "c2VjcmV0LWtleS1mb3ItdGlja2V0bmVzdC1hdXRoLXNlcnZpY2UtY2hhbmdlLW1lLTEyMzQ1Njc4"
  expiration-ms: 86400000   # 24 hours